[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "milestone-reconciliation-monitor"
version = "0.1.1"
description = "Synthetic milestone drift comparison and review findings"
requires-python = ">=3.11"
[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "coverage>=7,<9", "ruff>=0.12,<1", "mypy>=1.15,<3", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[tool.coverage.run]
branch = true
source = ["milestone_monitor"]

[tool.coverage.report]
show_missing = true
